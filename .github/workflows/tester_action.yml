name: Test build_run_model action

on:
  push:
    branches:
      - main

jobs:
  # Job 1
  build-run-lorenz_96-mpi-gfortran:

    # Runner instance OS
    runs-on: ubuntu-latest

    # The 'ncarcisl' containers initialize their software environment 
    # through 'sourcing' a common configuration file (/container/config_env.sh). 
    # This is done by starting a bash *login* shell (bash -l [...])
    defaults:
      run:
        shell: bash -elo pipefail {0}

    # Deploy container on top of runner instance
    container: 
      image: hkershaw/dart-dep:2.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set checked out repo as a safe git directory
        run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

      - name: Modify mkmf to use 2 cores for compilation
        run: |
          cd build_templates
          sed -i 's|exec '\''make'\'', '\''-f'\'', \$opt_m if \$opt_x;|exec '\''make'\'', '\''-j'\'', '\''2'\'', '\''-f'\'', \$opt_m if \$opt_x;|' mkmf

      - name: Build and run lorenz_96 with mpi
        uses: ./.github/actions/build_run_model 
        with: 
          model: lorenz_96
          run-program: ./filter
          compiler: gfortran
          use-mpi: mpi
  
  # Job 2
  build-run-lorenz_96-nompi-gfortran:

    # Runner instance OS
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -elo pipefail {0}

    # Deploy container on top of runner instance
    container:
      image: hkershaw/dart-dep:2.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set checked out repo as a safe git directory
        run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

      - name: Modify mkmf to use 2 cores for compilation
        run: |
          cd build_templates
          sed -i 's|exec '\''make'\'', '\''-f'\'', \$opt_m if \$opt_x;|exec '\''make'\'', '\''-j'\'', '\''2'\'', '\''-f'\'', \$opt_m if \$opt_x;|' mkmf

      - name: Build and run lorenz_63 with no mpi
        uses: ./.github/actions/build_run_model
        with:
          model: lorenz_96
          run-program: ./filter
          compiler: gfortran
          use-mpi: nompi

  # Job 3
  build-run-lorenz_96-mpif08-gfortran:

    # Runner instance OS
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -elo pipefail {0}

    # Deploy container on top of runner instance
    container:
      image: hkershaw/dart-dep:2.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set checked out repo as a safe git directory
        run: git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

      - name: Modify mkmf to use 2 cores for compilation
        run: |
          cd build_templates
          sed -i 's|exec '\''make'\'', '\''-f'\'', \$opt_m if \$opt_x;|exec '\''make'\'', '\''-j'\'', '\''2'\'', '\''-f'\'', \$opt_m if \$opt_x;|' mkmf

      - name: Build and run lorenz_96 with mpif08
        uses: ./.github/actions/build_run_model
        with:
          model: lorenz_96
          run-program: ./filter
          use-mpi: mpif08
          # not specifying compiler, which should default to gfortran
